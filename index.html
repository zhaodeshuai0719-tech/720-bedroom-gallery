<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卧室效果图 · 相册</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}.backdrop{position:fixed;inset:-30px;background:center/cover url("bedroom-1.jpg") no-repeat;filter:blur(16px);transform:scale(1.08);opacity:.34}.veil{position:fixed;inset:0;background:rgba(0,0,0,.68)}.viewer{position:relative;width:min(92vw,1180px);height:min(86vh,820px);margin:auto;display:grid;place-items:center}.photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 12px 36px rgba(0,0,0,.45);user-select:none;-webkit-user-drag:none}.bar{position:fixed;top:0;left:0;right:0;z-index:3;height:62px;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 18px 10px;background:linear-gradient(180deg,rgba(0,0,0,.76),transparent);font-size:15px}.title{font-weight:600}.close{position:absolute;right:18px;top:max(10px,env(safe-area-inset-top));font-size:30px;line-height:1;color:#fff;text-decoration:none;padding:4px 8px}.arrow{position:fixed;z-index:4;top:50%;transform:translateY(-50%);width:58px;height:88px;border:0;background:rgba(0,0,0,.3);color:#fff;font-size:66px;font-weight:200;line-height:70px;cursor:pointer;border-radius:8px}.arrow:hover{background:rgba(0,0,0,.5)}.prev{left:max(18px,calc(50% - min(46vw,590px) - 72px))}.next{right:max(18px,calc(50% - min(46vw,590px) - 72px))}.counter{position:fixed;z-index:4;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 15px;border-radius:999px;background:rgba(0,0,0,.55);font-size:14px}.hint{position:fixed;z-index:4;bottom:max(64px,calc(env(safe-area-inset-bottom) + 64px));left:50%;transform:translateX(-50%);white-space:nowrap;color:rgba(255,255,255,.76);font-size:12px}@media(max-width:600px){.backdrop{filter:blur(12px);opacity:.18}.viewer{width:100vw;height:100vh}.photo{width:100vw;max-height:100vh;box-shadow:none}.bar{height:58px}.arrow{width:42px;height:66px;font-size:48px;line-height:54px;background:rgba(0,0,0,.22)}.prev{left:5px}.next{right:5px}.hint{font-size:11px}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<header class="bar"><span class="title">卧室效果图</span><a class="close" href="https://720.3vjia.com/S160655458" aria-label="返回全景">×</a></header>
<main class="viewer" aria-label="卧室效果图相册"><img id="photo" class="photo" src="bedroom-1.jpg" alt="卧室效果图 1"></main>
<button class="arrow prev" id="prev" aria-label="上一张">‹</button><button class="arrow next" id="next" aria-label="下一张">›</button>
<div class="hint">左右滑动或点击箭头翻页</div><div class="counter" id="counter">1 / 3</div>
<script>
const images=['bedroom-1.jpg','bedroom-2.jpg','bedroom-3.jpg'];let i=0;const photo=document.getElementById('photo'),counter=document.getElementById('counter');function show(n){i=(n+images.length)%images.length;photo.src=images[i];photo.alt='卧室效果图 '+(i+1);counter.textContent=(i+1)+' / '+images.length;document.querySelector('.backdrop').style.backgroundImage='url("'+images[i]+'")'}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))show(i+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')location.href='https://720.3vjia.com/S160655458'});
</script></body></html>
